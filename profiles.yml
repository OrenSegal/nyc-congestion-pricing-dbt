# `dev` runs locally on DuckDB and reads data/landing/*.parquet (made by scripts/extract.py).
# `bq` runs on BigQuery (sandbox tier works) after the parquet files are loaded into
# a table tlc_raw.weekly_od; see README. Set GCP_PROJECT and run `gcloud auth application-default login`.
nyc_congestion_pricing:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: congestion.duckdb
      threads: 4
    bq:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: "{{ env_var('BQ_DATASET', 'congestion_pricing') }}"
      location: US
      threads: 4
