name: dbt build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Runs every model and test on the committed sample (24 zones, all weeks).
      - run: |
          dbt build --vars '{landing_glob: fixtures/weekly_od_sample.parquet, min_baseline_trips: 50}'
      - run: python experiment/analyze.py --check

  # One stable name for the main-branch ruleset to require (.github/rulesets/main.json).
  # Matrix jobs report one check per leg, and the leg names change with the matrix.
  # This job passes only when every job above passed or was skipped.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
